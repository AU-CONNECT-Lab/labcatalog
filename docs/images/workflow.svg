<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="370" rx="16" fill="#f6f8fa" stroke="#e3e6ea" stroke-width="2"/>
  <text x="34" y="38" font-size="12" font-weight="600" letter-spacing="1" fill="#8b949e">FROM YOUR FILES TO A PAPER</text>

  <!-- 1 Your data -->
  <g transform="translate(32,60)">
    <rect width="190" height="220" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="13" fill="#e8eef5"/>
    <text x="28" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4e89">1</text>
    <text x="50" y="36" font-size="16" font-weight="600" fill="#1f2328">Your data</text>
    <text x="20" y="74" font-size="13" fill="#57606a">
      <tspan x="20">Raw exports from</tspan>
      <tspan x="20" dy="19">surveys, tasks and</tspan>
      <tspan x="20" dy="19">sensors, as they are</tspan>
    </text>
    <line x1="20" y1="168" x2="170" y2="168" stroke="#eff1f3" stroke-width="1.5"/>
    <text x="20" y="194" font-size="12.5" font-weight="600" fill="#57606a">Your own folders</text>
  </g>

  <!-- 2 Prepare -->
  <g transform="translate(258,60)">
    <rect width="190" height="220" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="13" fill="#e8eef5"/>
    <text x="28" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4e89">2</text>
    <text x="50" y="36" font-size="16" font-weight="600" fill="#1f2328">Prepare</text>
    <text x="20" y="74" font-size="13" fill="#57606a">
      <tspan x="20">Your cleaning scripts</tspan>
      <tspan x="20" dy="19">run step by step;</tspan>
      <tspan x="20" dy="19">outdated outputs</tspan>
      <tspan x="20" dy="19">are flagged</tspan>
    </text>
    <line x1="20" y1="168" x2="170" y2="168" stroke="#eff1f3" stroke-width="1.5"/>
    <text x="20" y="194" font-size="12.5" font-weight="600" fill="#1d4e89">Prepare page</text>
  </g>

  <!-- 3 Describe -->
  <g transform="translate(484,60)">
    <rect width="190" height="220" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="13" fill="#e8eef5"/>
    <text x="28" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4e89">3</text>
    <text x="50" y="36" font-size="16" font-weight="600" fill="#1f2328">Describe</text>
    <text x="20" y="74" font-size="13" fill="#57606a">
      <tspan x="20">Instruments, studies</tspan>
      <tspan x="20" dy="19">and column maps, in</tspan>
      <tspan x="20" dy="19">plain YAML and CSV</tspan>
    </text>
    <line x1="20" y1="168" x2="170" y2="168" stroke="#eff1f3" stroke-width="1.5"/>
    <text x="20" y="194" font-size="12.5" font-weight="600" fill="#1d4e89">Import, Studies, Edit</text>
  </g>

  <!-- 4 Check -->
  <g transform="translate(710,60)">
    <rect width="190" height="220" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="13" fill="#e8eef5"/>
    <text x="28" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4e89">4</text>
    <text x="50" y="36" font-size="16" font-weight="600" fill="#1f2328">Check</text>
    <text x="20" y="74" font-size="13" fill="#57606a">
      <tspan x="20">Every value against</tspan>
      <tspan x="20" dy="19">its options, ranges</tspan>
      <tspan x="20" dy="19">and IDs, each problem</tspan>
      <tspan x="20" dy="19">with a way to fix it</tspan>
    </text>
    <line x1="20" y1="168" x2="170" y2="168" stroke="#eff1f3" stroke-width="1.5"/>
    <text x="20" y="194" font-size="12.5" font-weight="600" fill="#1d4e89">Problems page</text>
  </g>

  <!-- 5 Use -->
  <g transform="translate(936,60)">
    <rect width="232" height="220" rx="10" fill="#ffffff" stroke="#1d4e89" stroke-width="2"/>
    <text x="20" y="34" font-size="14" font-weight="600" fill="#1d4e89">Browse</text>
    <text x="20" y="54" font-size="12.5" fill="#57606a">
      <tspan x="20">Instruments, waves and</tspan>
      <tspan x="20" dy="17">datasets at a glance</tspan>
    </text>
    <line x1="20" y1="86" x2="212" y2="86" stroke="#eff1f3" stroke-width="1.5"/>
    <text x="20" y="108" font-size="14" font-weight="600" fill="#1d4e89">Analyze</text>
    <text x="20" y="128" font-size="12.5" fill="#57606a">
      <tspan x="20">Correlations, regression,</tspan>
      <tspan x="20" dy="17">groups, multilevel; R first</tspan>
    </text>
    <line x1="20" y1="160" x2="212" y2="160" stroke="#eff1f3" stroke-width="1.5"/>
    <text x="20" y="182" font-size="14" font-weight="600" fill="#1d4e89">Write up</text>
    <text x="20" y="202" font-size="12.5" fill="#57606a">Methods text, APA tables</text>
  </g>

  <!-- Arrows between stages -->
  <g stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#head)">
    <line x1="226" y1="170" x2="252" y2="170"/>
    <line x1="452" y1="170" x2="478" y2="170"/>
    <line x1="678" y1="170" x2="704" y2="170"/>
    <line x1="904" y1="170" x2="930" y2="170"/>
  </g>

  <!-- Fix and check again -->
  <path d="M805,284 C805,336 579,336 579,290" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#head)"/>
  <text x="692" y="350" text-anchor="middle" font-size="12.5" fill="#57606a">fix, then check again</text>
</svg>
