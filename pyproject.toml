[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labcatalog"
dynamic = ["version"]
description = "Build a browsable catalog of a lab's study data: instruments, variables across waves, scoring code, and summary statistics."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors =[{ name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" }]
maintainers = [{ name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pandas>=2.0",
    "nicegui>=3.1",
    "pywebview>=6.0",
    "plotly>=6.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "bibtexparser>=2.1,<3",
    "python-docx>=1.1",
    "ruamel.yaml>=0.18",
    "pyreadstat>=1.2",
    "semopy>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "pyinstaller>=6.0"]
docs = ["jupyter-book>=2"]
ai = [
    "anthropic>=1.0",
    "openai>=1.40",
    "google-generativeai>=0.8",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.10",
]

[project.scripts]
labcatalog = "labcatalog.cli:main"

[tool.hatch.version]
path = "src/labcatalog/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/labcatalog"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
