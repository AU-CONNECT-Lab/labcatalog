[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labcatalog"
version = "0.1.0"
description = "Build a browsable catalog of a lab's study data: instruments, variables across waves, scoring code, and summary statistics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pandas>=2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
labcatalog = "labcatalog.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/labcatalog"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
