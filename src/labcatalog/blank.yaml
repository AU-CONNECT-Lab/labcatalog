# yaml-language-server: $schema=schemas/labcatalog.schema.json
# Settings for one labcatalog project. Instruments go in instruments/, studies in studies/, each dataset's column map in maps/.
# For a filled-in example, run: labcatalog init <new folder>

project:
  name: PROJECT_NAME

# Allowed words for each dataset's modality and reporter, and for each administration's target.
vocab:
  modalities: [questionnaire]
  reporters: []
  targets: []

# Codes in the data that mean "no answer"; they are counted, never scored. Blank cells always count as missing.
missing_codes: []

# Each study and its waves, for example:  my_study: {label: My Study, waves: {1: {start: 2026-01-01}}}
# A study can also have a description, a citation (how to cite its data) and a doi; the Datasets page shows them.
# Deadlines and other dates go in milestones, for example: milestones: [{name: Interim report, date: 2026-12-15}]; the Overview timeline shows them.
studies: {}

# One entry per data file, for example:
#   - {name: parent_w1, modality: questionnaire, study: my_study, wave: 1, reporter: parent, source: csv, path: data/parent_w1.csv}
datasets: []

# Optional: your own cleaning scripts, run in order from the Prepare page or with "labcatalog prepare", for example:
#   prepare:
#     - {name: clean_parent_w1, run: Rscript scripts/clean_parent.R, inputs: [raw/parent_w1_export.csv, scripts/clean_parent.R], outputs: [data/parent_w1.csv]}
# A step is outdated when one of its inputs is newer than its outputs, so list the script among the inputs.
