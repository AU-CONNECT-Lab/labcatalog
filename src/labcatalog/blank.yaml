# yaml-language-server: $schema=schemas/labcatalog.schema.json
# Settings for one labcatalog project. Instruments go in instruments/, studies in studies/, each dataset's column map in maps/.
# For a filled-in example, run: labcatalog init <new folder>

project:
  name: PROJECT_NAME

# Allowed words for each dataset's modality and reporter, and for each administration's target.
vocab:
  modalities: [questionnaire]
  # Optional: how a modality reads in tables and in the Methods text, for example {eeg: EEG}.
  modality_labels: {}
  reporters: []
  targets: []

# Codes in the data that mean "no answer"; they are counted, never scored. Blank cells always count as missing.
missing_codes: []

# Optional: how the statistics run, shown here with their defaults. Everyone opening the project gets the same numbers.
#   stats:
#     correlate_by: id          # how people in different files are matched: id, a group name under ids, or none
#     cfa_estimator: wlsmv      # factor models with the items as ordered categories (wlsmv) or continuous (ml)
#     t_test: welch             # two groups: Welch's (welch) or Student's (student) t test
#     correlation: pearson      # correlations: pearson or spearman
#     invariance_free: []       # items freed in invariance tests, for example: [{instrument: my_scale, item: q3, parameter: loading, across: waves}]

# Each study and its waves, for example:  my_study: {label: My Study, waves: {1: {start: 2026-01-01}}}
# A study can also have a description and a reference (the key in references.bib of how to cite its data); the Datasets page shows them.
# Deadlines and other dates go in milestones, for example: milestones: [{name: Interim report, date: 2026-12-15}]; the Overview timeline shows them.
studies: {}

# One entry per data file, for example:
#   - {name: parent_w1, modality: questionnaire, study: my_study, wave: 1, reporter: parent, source: csv, path: data/parent_w1.csv}
# A folder dataset counts each person's files instead of reading a table, for example a BIDS folder:
#   - {name: fmri_w1, modality: fmri, study: my_study, wave: 1, reporter: child, source: folder, path: bids, files: "sub-{id}/ses-1/func/*_bold.nii.gz"}
# Its data are the ID and a files column (how many files matched); map files to an item like any other column.
# Datasets are matched on their ID column, so the part of the path at {id} must be written as the IDs in your other datasets.
datasets: []

# Optional: your own cleaning scripts, run in order from the Prepare page or with "labcatalog prepare", for example:
#   prepare:
#     - {name: clean_parent_w1, run: Rscript scripts/clean_parent.R, inputs: [raw/parent_w1_export.csv, scripts/clean_parent.R], outputs: [data/parent_w1.csv]}
# A step is outdated when one of its inputs is newer than its outputs, so list the script among the inputs.

# Optional: the template of each instrument's Measures paragraph on its page, in place of the built-in one:
#   measures: "We used {named}. {description} {items} {reverse} {scoring} {alpha} {omega}"
# Placeholders: name, abbreviation, cite, named, construct, reporter, n_items, scale, description, items, reverse, scoring, alpha, omega.
# An instrument can have its own template (measures:) and a sentence or two about what it measures (description:).
# Optional: the template of each study's Participants paragraph on the Methods page:
#   participants: "{waves} {counts} {retention} {modalities}"
# Placeholders: study, n_waves, waves, counts, retention, modalities. A study can have its own (participants:) in its file in studies/.
