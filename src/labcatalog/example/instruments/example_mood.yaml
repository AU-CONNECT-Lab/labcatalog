# yaml-language-server: $schema=../schemas/instrument.schema.json
id: example_mood
name: Example Mood Scale
abbreviation: EMS
construct_name: Mood and negative affect
description: It asks how often in the past two weeks the child felt sad, worried or tired, and how often they enjoyed things.
instructions: Think about the past two weeks. How often did you feel this way?
response_sets:
  - id: frequency
    options:
      - {value: 0, label: Never}
      - {value: 1, label: Sometimes}
      - {value: 2, label: Often}
      - {value: 3, label: Always}
default_response_set: frequency
items:
  - {id: ems_1, text: I felt happy., reverse: true}
  - {id: ems_2, text: I felt sad.}
  - {id: ems_3, text: I worried about things.}
  - {id: ems_4, text: I enjoyed the things I did., reverse: true}
  - {id: ems_5, text: I felt tired for no reason.}
  - {id: ems_6, text: I felt like crying.}
  - {id: ems_7, text: I felt lonely.}
  - {id: ems_8, text: I found it hard to stop worrying.}
  - {id: ems_9, text: I had fun with my friends., reverse: true}
scores:
  - {id: ems_total, label: Total score, method: sum, items: [ems_1, ems_2, ems_3, ems_4, ems_5, ems_6, ems_7, ems_8, ems_9], missing_rule: prorate, min_valid: 7, custom: {topics: [negative affect]}}
  - {id: ems_sadness, label: Sadness, method: sum, items: [ems_2, ems_6, ems_7], custom: {topics: [negative affect]}}
  - {id: ems_worry, label: Worry and fatigue, method: sum, items: [ems_3, ems_5, ems_8], custom: {topics: [negative affect, sleep]}}
  - {id: ems_low_positive, label: Low positive affect, method: sum, items: [ems_1, ems_4, ems_9], custom: {topics: [positive affect]}}
references:
  - {key: example2019, pdf: example_mood.pdf}
license: Free for research use (fictional)
custom:
  domain: emotion
