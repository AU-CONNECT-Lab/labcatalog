id: example_screen_time
name: Example Screen Time Questions
abbreviation: EST
construct_name: Screen use
response_sets:
  - id: hours
    options:
      - {value: 0, label: Less than 1 hour}
      - {value: 1, label: 1 to 2 hours}
      - {value: 2, label: 3 to 4 hours}
      - {value: 3, label: 5 hours or more}
  - id: frequency
    options:
      - {value: 0, label: Never}
      - {value: 1, label: Sometimes}
      - {value: 2, label: Often}
      - {value: 3, label: Always}
default_response_set: hours
items:
  - {id: est_1, text: "On a school day, how many hours do you spend on screens?"}
  - {id: est_2, text: "On a weekend day, how many hours do you spend on screens?"}
  - {id: est_3, text: "How often do you use a phone or tablet in bed?", response_set: frequency}
custom:
  domain: media
