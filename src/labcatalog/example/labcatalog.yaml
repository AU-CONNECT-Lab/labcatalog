# yaml-language-server: $schema=schemas/labcatalog.schema.json
# Settings for one labcatalog project. Instruments live in instruments/, studies in studies/, and each dataset's column map in maps/.
# This example is fictional and contains a few deliberate data problems (values outside the options, a child age outside its allowed range, an ID with a space, an ID used twice, a child missing from the roster, people who gave the same answer to every item, a column the map does not describe) so that the Problems page has something to show.

project:
  name: Mock Family Study Catalog

# Allowed words for each dataset's modality and reporter, and for each administration's target.
vocab:
  modalities: [questionnaire, eeg, fmri, fnirs, eyetracking, video, ecg, saliva]
  # How each modality reads in tables and in the Methods text; the plain word when left out.
  modality_labels: {questionnaire: questionnaires, eeg: EEG, fmri: fMRI, fnirs: fNIRS, eyetracking: eye tracking, video: video coding, ecg: ECG, saliva: salivary cortisol}
  reporters: [parent, child]
  targets: [self, child]

# Codes in the data that mean "no answer"; they are counted, never scored. Blank cells always count as missing.
missing_codes:
  - {code: -99, label: refused}
  - {code: -98, label: not applicable}
  - {code: -97, label: don't know}
  - {code: "", label: blank}

# Used when a dataset does not say otherwise.
defaults:
  id_column: pid

# The ID format to check, and the group people belong to (here a family; the name is yours), so parents and children can be linked.
ids:
  pattern: '^\d{4}[PC]$'
  group:
    name: family

# Everyone in the study once, one row per person: each person's family comes from its group column, which you name. Every dataset, including those holding only a child's ID, takes its families from here.
# The instrument describes the roster's other columns (mapped in maps/roster.csv); the Analysis page offers them for the people of every file.
roster:
  path: data/participants.csv
  id_column: pid
  group_column: family_id
  instrument: example_participants

# Score correlations link a parent and a child through their family. The other three are the defaults:
# factor models with the items as ordered categories (wlsmv) or continuous (ml); two groups compared
# with Welch's (welch) or Student's (student) t test; correlations as Pearson (pearson) or Spearman (spearman).
stats:
  correlate_by: family
  cfa_estimator: wlsmv
  t_test: welch
  correlation: pearson

# Each study and its waves; a wave with no end date is still collecting.
studies:
  mock_study:
    label: Mock Family Study
    description: A fictional three-wave study in which parents and their children answer questionnaires about stress, sleep, mood, worries and screen time once a year. Some families take part with two children.
    reference: mockstudy2026
    waves:
      1: {start: 2024-03-01, end: 2024-10-31}
      2: {start: 2025-03-01, end: 2025-10-31}
      3: {start: 2026-03-01}
    milestones:
      - {name: Interim report, date: 2026-12-15}
      - {name: Wave 3 data freeze, date: 2027-01-31}

# One entry per data file: which study, wave and reporter it holds, and where it is.
datasets:
  - {name: parent_w1, modality: questionnaire, study: mock_study, wave: 1, reporter: parent, source: csv, path: data/parent_w1.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: parent_w2, modality: questionnaire, study: mock_study, wave: 2, reporter: parent, source: csv, path: data/parent_w2.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: parent_w3, modality: questionnaire, study: mock_study, wave: 3, reporter: parent, source: csv, path: data/parent_w3.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: child_w1, modality: questionnaire, study: mock_study, wave: 1, reporter: child, source: csv, path: data/child_w1.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: child_w2, modality: questionnaire, study: mock_study, wave: 2, reporter: child, source: csv, path: data/child_w2.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: child_w3, modality: questionnaire, study: mock_study, wave: 3, reporter: child, source: csv, path: data/child_w3.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: parent_child_w1, modality: questionnaire, study: mock_study, wave: 1, reporter: parent, source: csv, path: data/parent_child_w1.csv, respondent_column: parent_pid, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: parent_child_w2, modality: questionnaire, study: mock_study, wave: 2, reporter: parent, source: csv, path: data/parent_child_w2.csv, respondent_column: parent_pid, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: parent_child_w3, modality: questionnaire, study: mock_study, wave: 3, reporter: parent, source: csv, path: data/parent_child_w3.csv, respondent_column: parent_pid, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: eeg_w1, modality: eeg, study: mock_study, wave: 1, reporter: child, source: csv, path: data/eeg_w1.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: eeg_w3, modality: eeg, study: mock_study, wave: 3, reporter: child, source: csv, path: data/eeg_w3.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: fmri_w1, modality: fmri, study: mock_study, wave: 1, reporter: child, source: csv, path: data/fmri_w1.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: fmri_w3, modality: fmri, study: mock_study, wave: 3, reporter: child, source: csv, path: data/fmri_w3.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: fnirs_w2, modality: fnirs, study: mock_study, wave: 2, reporter: child, source: csv, path: data/fnirs_w2.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: eyetracking_w1, modality: eyetracking, study: mock_study, wave: 1, reporter: child, source: csv, path: data/eyetracking_w1.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: eyetracking_w2, modality: eyetracking, study: mock_study, wave: 2, reporter: child, source: csv, path: data/eyetracking_w2.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: video_w2, modality: video, study: mock_study, wave: 2, reporter: child, source: csv, path: data/video_w2.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: ecg_w2, modality: ecg, study: mock_study, wave: 2, reporter: child, source: csv, path: data/ecg_w2.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: ecg_w3, modality: ecg, study: mock_study, wave: 3, reporter: child, source: csv, path: data/ecg_w3.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: saliva_w1, modality: saliva, study: mock_study, wave: 1, reporter: child, source: csv, path: data/saliva_w1.csv, date_column: visit_date, snapshot_date: 2026-10-10}
  - {name: saliva_w3, modality: saliva, study: mock_study, wave: 3, reporter: child, source: csv, path: data/saliva_w3.csv, date_column: visit_date, snapshot_date: 2026-10-10}

# Extra fields your lab wants on instruments, scores, administrations or datasets; choice and tags fields can be used as filters.
custom_fields:
  - name: domain
    label: Domain
    applies_to: instrument
    type: choice
    choices: [emotion, family, health, media]
  - name: topics
    label: Topics
    applies_to: score
    type: tags
    choices: [negative affect, positive affect, parenting, sleep]

# The filters on the Instruments page, in this order.
browse:
  facets: [study, wave, coverage, reporter, target, modality, domain, topics, status]

# The folder holding references.bib and the instruments' reference PDFs (often a shared Box or OneDrive folder; ~ and environment variables work). An instrument names each reference by its key in references.bib, which a reference manager such as Zotero can export and keep up to date; a reference's pdf is a path inside this folder.
references:
  root: references

# Your own cleaning scripts, run in order from the Prepare page or with "labcatalog prepare". Here one script turns each survey-platform export in raw/ into the clean file the catalog reads, and one script per modality turns the per-child results its pipeline left in derivatives/ into one row per child; listing the script among the inputs marks the step outdated when the script changes.
prepare:
  - {name: clean_parent_w1, run: python scripts/clean_export.py raw/parent_w1_export.csv data/parent_w1.csv, inputs: [raw/parent_w1_export.csv, scripts/clean_export.py], outputs: [data/parent_w1.csv]}
  - {name: clean_parent_w2, run: python scripts/clean_export.py raw/parent_w2_export.csv data/parent_w2.csv, inputs: [raw/parent_w2_export.csv, scripts/clean_export.py], outputs: [data/parent_w2.csv]}
  - {name: clean_parent_w3, run: python scripts/clean_export.py raw/parent_w3_export.csv data/parent_w3.csv, inputs: [raw/parent_w3_export.csv, scripts/clean_export.py], outputs: [data/parent_w3.csv]}
  - {name: clean_child_w1, run: python scripts/clean_export.py raw/child_w1_export.csv data/child_w1.csv, inputs: [raw/child_w1_export.csv, scripts/clean_export.py], outputs: [data/child_w1.csv]}
  - {name: clean_child_w2, run: python scripts/clean_export.py raw/child_w2_export.csv data/child_w2.csv, inputs: [raw/child_w2_export.csv, scripts/clean_export.py], outputs: [data/child_w2.csv]}
  - {name: clean_child_w3, run: python scripts/clean_export.py raw/child_w3_export.csv data/child_w3.csv, inputs: [raw/child_w3_export.csv, scripts/clean_export.py], outputs: [data/child_w3.csv]}
  - {name: clean_parent_child_w1, run: python scripts/clean_export.py raw/parent_child_w1_export.csv data/parent_child_w1.csv, inputs: [raw/parent_child_w1_export.csv, scripts/clean_export.py], outputs: [data/parent_child_w1.csv]}
  - {name: clean_parent_child_w2, run: python scripts/clean_export.py raw/parent_child_w2_export.csv data/parent_child_w2.csv, inputs: [raw/parent_child_w2_export.csv, scripts/clean_export.py], outputs: [data/parent_child_w2.csv]}
  - {name: clean_parent_child_w3, run: python scripts/clean_export.py raw/parent_child_w3_export.csv data/parent_child_w3.csv, inputs: [raw/parent_child_w3_export.csv, scripts/clean_export.py], outputs: [data/parent_child_w3.csv]}
  - {name: extract_eeg_w1, run: python scripts/extract_eeg.py derivatives/eeg/ses-1 data/eeg_w1.csv, inputs: [derivatives/eeg/ses-1/qc.csv, scripts/extract_eeg.py], outputs: [data/eeg_w1.csv]}
  - {name: extract_eeg_w3, run: python scripts/extract_eeg.py derivatives/eeg/ses-3 data/eeg_w3.csv, inputs: [derivatives/eeg/ses-3/qc.csv, scripts/extract_eeg.py], outputs: [data/eeg_w3.csv]}
  - {name: extract_fmri_w1, run: python scripts/extract_fmri.py derivatives/fmri/ses-1 data/fmri_w1.csv, inputs: [derivatives/fmri/ses-1/motion.csv, scripts/extract_fmri.py], outputs: [data/fmri_w1.csv]}
  - {name: extract_fmri_w3, run: python scripts/extract_fmri.py derivatives/fmri/ses-3 data/fmri_w3.csv, inputs: [derivatives/fmri/ses-3/motion.csv, scripts/extract_fmri.py], outputs: [data/fmri_w3.csv]}
  - {name: extract_fnirs_w2, run: python scripts/extract_fnirs.py derivatives/fnirs/ses-2 data/fnirs_w2.csv, inputs: [derivatives/fnirs/ses-2/qc.csv, scripts/extract_fnirs.py], outputs: [data/fnirs_w2.csv]}
  - {name: extract_eyetracking_w1, run: python scripts/extract_eyetracking.py derivatives/eyetracking/ses-1 data/eyetracking_w1.csv, inputs: [derivatives/eyetracking/ses-1/sessions.csv, scripts/extract_eyetracking.py], outputs: [data/eyetracking_w1.csv]}
  - {name: extract_eyetracking_w2, run: python scripts/extract_eyetracking.py derivatives/eyetracking/ses-2 data/eyetracking_w2.csv, inputs: [derivatives/eyetracking/ses-2/sessions.csv, scripts/extract_eyetracking.py], outputs: [data/eyetracking_w2.csv]}
  - {name: extract_video_w2, run: python scripts/extract_video.py derivatives/video/ses-2 data/video_w2.csv, inputs: [derivatives/video/ses-2/sessions.csv, scripts/extract_video.py], outputs: [data/video_w2.csv]}
  - {name: extract_ecg_w2, run: python scripts/extract_ecg.py derivatives/ecg/ses-2 data/ecg_w2.csv, inputs: [derivatives/ecg/ses-2/sessions.csv, scripts/extract_ecg.py], outputs: [data/ecg_w2.csv]}
  - {name: extract_ecg_w3, run: python scripts/extract_ecg.py derivatives/ecg/ses-3 data/ecg_w3.csv, inputs: [derivatives/ecg/ses-3/sessions.csv, scripts/extract_ecg.py], outputs: [data/ecg_w3.csv]}
  - {name: extract_saliva_w1, run: python scripts/extract_saliva.py derivatives/saliva/ses-1/assay_report.csv data/saliva_w1.csv, inputs: [derivatives/saliva/ses-1/assay_report.csv, scripts/extract_saliva.py], outputs: [data/saliva_w1.csv]}
  - {name: extract_saliva_w3, run: python scripts/extract_saliva.py derivatives/saliva/ses-3/assay_report.csv data/saliva_w3.csv, inputs: [derivatives/saliva/ses-3/assay_report.csv, scripts/extract_saliva.py], outputs: [data/saliva_w3.csv]}
