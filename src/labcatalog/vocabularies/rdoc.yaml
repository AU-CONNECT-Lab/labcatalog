# Domains of the Research Domain Criteria, each with its constructs.
Negative Valence Systems:
  - Acute Threat ("Fear")
  - Potential Threat ("Anxiety")
  - Sustained Threat
  - Loss
  - Frustrative Nonreward
Positive Valence Systems:
  - Reward Responsiveness
  - Reward Learning
  - Reward Valuation
Cognitive Systems:
  - Attention
  - Perception
  - Declarative Memory
  - Language
  - Cognitive Control
  - Working Memory
Social Processes:
  - Affiliation and Attachment
  - Social Communication
  - Perception and Understanding of Self
  - Perception and Understanding of Others
Arousal and Regulatory Systems:
  - Arousal
  - Circadian Rhythms
  - Sleep-Wakefulness
Sensorimotor Systems:
  - Motor Actions
  - Agency and Ownership
  - Habit - Sensorimotor
  - Innate Motor Patterns
